name: Nova Bootstrap connect hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nova-bootstrap-connect-hotfix.yml

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Nova Bootstrap connect permissions
        shell: python
        run: |
          from pathlib import Path

          path = Path('bootstrap/nova-bootstrap.user.js')
          text = path.read_text(encoding='utf-8')

          old_connects = """// @connect      *.amazon.com
// @connect      *.a2z.com
// @connect      amazon.co.uk
// @connect      *.amazon.co.uk
// @connect      localhost"""

          new_connects = """// @connect      amazon.com
// @connect      a2z.com
// @connect      hero.eu.picking.aft.a2z.com
// @connect      drive.corp.amazon.com
// @connect      drive-render.corp.amazon.com
// @connect      amazon.co.uk
// @connect      localhost"""

          if old_connects not in text:
              raise SystemExit('Expected v2.3.1 connect block not found; refusing unsafe patch')

          text = text.replace('// @version      2.3.1', '// @version      2.3.2', 1)
          text = text.replace(old_connects, new_connects, 1)
          text = text.replace("const VERSION = '2.3.1';", "const VERSION = '2.3.2';", 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit Bootstrap 2.3.2
        run: |
          git config user.name "Nova Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap/nova-bootstrap.user.js
          git commit -m "Fix Nova Bootstrap GM connect permissions for Rodeo"
          git push origin HEAD:main
