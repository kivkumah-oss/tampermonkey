name: Nova BoxRec 0.4.1 hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nova-boxrec-042-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Bootstrap and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          bootstrap = Path('bootstrap/nova-bootstrap.user.js')
          text = bootstrap.read_text(encoding='utf-8')
          text = text.replace('// @version      2.3.1', '// @version      2.3.2', 1)
          text = text.replace("const VERSION = '2.3.1';", "const VERSION = '2.3.2';", 1)

          explicit = [
              '// @connect      hero.eu.picking.aft.a2z.com',
              '// @connect      a2z.com',
              '// @connect      amazon.com',
              '// @connect      drive.corp.amazon.com',
              '// @connect      drive-render.corp.amazon.com',
          ]
          anchor = '// @connect      cdn-o.suno.com\n'
          if anchor not in text:
              raise SystemExit('Bootstrap connect anchor not found')
          additions = ''.join(line + '\n' for line in explicit if line not in text)
          text = text.replace(anchor, anchor + additions, 1)
          bootstrap.write_text(text, encoding='utf-8')

          manifest_path = Path('nova.manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '2.6.42'
          manifest['bootstrapMinVersion'] = '2.3.2'
          manifest['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          found = False
          for module in manifest.get('modules', []):
              if module.get('id') == 'nova-rodeo-box-recommendation':
                  module['version'] = '0.4.1'
                  found = True
                  break
          if not found:
              raise SystemExit('BoxRec module not found in manifest')

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "Nova Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap/nova-bootstrap.user.js nova.manifest.json
          git commit -m "Fix Nova BoxRec HERO permission and force 0.4.1 reload" || exit 0
          git push
